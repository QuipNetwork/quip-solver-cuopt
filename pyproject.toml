[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ising-solver-nvidia"
version = "0.3.0rc2"
description = "NVIDIA cuOpt MILP Ising miner for quip.network protocol version 2"
readme = "README.md"
# Floor set by quip_solver_core, which requires >=3.11.
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

# quip_solver_core is the published PyO3 SDK (miner gRPC stubs +
# scoring/wire/session), installed as a prebuilt wheel from PyPI. The version
# is exact, as in quip-solver-dwave, so installs resolve the same consensus
# primitives. Move the pin deliberately.
dependencies = [
    "quip-solver-core==0.0.3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

# Console entry point must be exactly quip-cuopt-milp — isingmark resolves
# that binary name from $PATH.
[project.scripts]
quip-cuopt-milp = "quip_miner_cuopt.cli:main"

[project.urls]
Repository = "https://gitlab.com/quip.network/ising-solver-nvidia"

[tool.setuptools.packages.find]
include = ["quip_miner_cuopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
